services:
  gemeinde-app:
    build: .
    image: gemeinde-app:latest
    restart: unless-stopped
    env_file: .env
    ports:
      # Nur für den Reverse Proxy auf diesem Server; APP_BIND=0.0.0.0 öffnet den Port für alle.
      - "${APP_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - gemeinde-data:/data
    # Nur /data ist beschreibbar; der Prozess kann sich keine weiteren Rechte verschaffen.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
      # Docker in einer Proxmox-LXC kann das AppArmor-Profil docker-default nicht laden.
      # Auf einer VM oder direkt auf dem Host kann diese Zeile entfernt werden.
      - apparmor=unconfined

volumes:
  gemeinde-data:
